# High-Impact News Calendar
# ──────────────────────────────────────────────────────────────────────────────
# Instruments affected by each event:
#   ALL      → all 7 instruments
#   USD      → XAUUSD, NAS100, EURUSD, GBPUSD, XAGUSD, OIL (anything USD-linked)
#   EURUSD   → EURUSD only
#   GBPUSD   → GBPUSD only
#
# Blackout window: trades are blocked from (time - before_min) to (time + after_min).
# All times are UTC.
#
# Recurring events are handled automatically in code (NFP, EIA).
# Add one-off events here: FOMC, CPI, ECB, BOE meeting dates.
# ──────────────────────────────────────────────────────────────────────────────

# Default blackout windows by event type (minutes before/after release)
defaults:
  fomc:       { before_min: 30, after_min: 60 }
  cpi:        { before_min: 15, after_min: 30 }
  nfp:        { before_min: 15, after_min: 30 }
  boe:        { before_min: 15, after_min: 30 }
  ecb:        { before_min: 15, after_min: 30 }
  gdp:        { before_min: 10, after_min: 20 }
  pce:        { before_min: 10, after_min: 20 }
  eia:        { before_min: 5,  after_min: 15 }   # handled in OILStrategy too
  retail:     { before_min: 10, after_min: 20 }
  ppi:        { before_min: 10, after_min: 20 }

# ──────────────────────────────────────────────────────────────────────────────
# 2026 FOMC Meeting Dates  (rate decision released ~18:00 UTC same day)
# Source: federalreserve.gov/monetarypolicy/fomccalendars.htm
# ──────────────────────────────────────────────────────────────────────────────
